name: Glassbridge
options:
  bundleIdPrefix: com.kish
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "GN3TH9WD6W" # Apple Developer Team ID. See docs/LEARNINGS.md §2.
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: "0.7.0"

targets:
  Glassbridge:
    type: application
    platform: iOS
    sources:
      - path: Glassbridge
    info:
      path: Glassbridge/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Glassbridge sends voice queries to Claude through your Ray-Ban glasses."
        NSCameraUsageDescription: "Glassbridge sends what you're looking at to Claude as visual context."
        NSBluetoothAlwaysUsageDescription: "Glassbridge connects to your Meta Ray-Ban glasses for audio and photos."
        NSBluetoothPeripheralUsageDescription: "Glassbridge connects to your Meta Ray-Ban glasses for audio and photos."
        NSLocalNetworkUsageDescription: "Glassbridge talks to the Glassbridge backend on your Mac over your local Wi-Fi network."
        NSSpeechRecognitionUsageDescription: "Glassbridge listens on-device for your wake word so you can start a question hands-free."
        NSSupportsLiveActivities: true
        # Turn recordings land in Documents/recordings. These expose them in Files.app so
        # they can come off the device without tethering mid-test. See SessionRecorder.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - bluetooth-peripheral
          - external-accessory
          - audio
        UISupportedExternalAccessoryProtocols:
          - com.meta.ar.wearable
        LSApplicationQueriesSchemes:
          - fb-viewapp
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [glassbridge]
        MWDAT:
          AppLinkURLScheme: "glassbridge://"
          MetaAppID: "0"        # "0" = dev mode. For production: get from Wearables Developer Center.
          TeamID: "GN3TH9WD6W"  # Apple Developer Team ID, same as DEVELOPMENT_TEAM above.
          Analytics:
            OptOut: true
        NSAppTransportSecurity:
          # NSAllowsLocalNetworking only exempts RFC1918 (192.168/16, 10/8, 172.16/12),
          # .local, and link-local. Tailscale addresses are CGNAT (100.64.0.0/10), which
          # iOS does not count as local networking, so the backend over Tailscale was
          # blocked outright with "requires the use of a secure connection".
          # The backend is plain HTTP on a private tailnet, so allow cleartext.
          #
          # NSAllowsLocalNetworking is deliberately absent. Apple's rule: for apps built
          # against iOS 10 or later, if NSAllowsLocalNetworking (or the WebContent/Media
          # variants) is present, NSAllowsArbitraryLoads is IGNORED. Having both meant the
          # exception silently did nothing. ArbitraryLoads already covers LAN addresses,
          # so nothing is lost by dropping it.
          NSAllowsArbitraryLoads: true
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATMockDevice
      - target: GlassbridgeWidgetsExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kish.glassbridge
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  GlassbridgeWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: GlassbridgeWidgets
      - path: Glassbridge/GlassbridgeActivityAttributes.swift
    info:
      path: GlassbridgeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Glassbridge
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kish.glassbridge.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
